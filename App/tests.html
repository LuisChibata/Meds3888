<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FIT-FIRST matching tests</title>
<style>
  :root { --paper: #f6f3ed; --ink: #172234; --muted: #505b6c; --line: #dfd9ce; --pass: #1c5660; --fail: #a12d2d; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #10151c; --ink: #ece8e0; --muted: #a3acba; --line: #2c3643; --pass: #7cbec2; --fail: #f08a8a; color-scheme: dark; }
  }
  body { margin: 0; padding: 24px 16px 48px; background: var(--paper); color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 32px 0 6px; }
  p { color: var(--muted); margin: 4px 0; }
  .pass { color: var(--pass); font-weight: 700; }
  .fail { color: var(--fail); font-weight: 700; }
  ul { margin: 6px 0; padding-left: 20px; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 14px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .wrap { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <h1>Matching tests</h1>
  <p>Runs the fictional test patients (<code>src/data/test-patients.js</code>) and data checks against <code>src/matching.js</code>. Change weights, then reload.</p>
  <p id="summary"></p>
  <div id="out"></div>
</main>
<script src="src/data/questions.js"></script>
<script src="src/data/therapists.js"></script>
<script src="src/data/test-patients.js"></script>
<script src="src/matching.js"></script>
<script>
"use strict";
(function () {
  const out = document.getElementById("out");
  const results = [];
  const check = (group, name, ok, detail) => results.push({ group, name, ok: !!ok, detail: detail || "" });
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* Data checks: every therapist field uses ids the questionnaire knows, so scoring can't silently miss. */
  const ids = (qid) => FF.question(qid).options.map(([id]) => id);
  const MODALITIES = ["cbt", "act", "dbt", "ipt", "psychodynamic", "person_centred"];
  const CONTEXT_KEYS = ["cultural", "faith", "international", "lgbtq", "students", "working"];
  const subset = (arr, allowed) => arr.filter((x) => allowed.indexOf(x) === -1);
  check("Data", "8 therapists, unique ids", FF.THERAPISTS.length === 8 && new Set(FF.THERAPISTS.map((t) => t.id)).size === 8);
  FF.THERAPISTS.forEach((t) => {
    const bad = []
      .concat(subset(t.qualities, ids("q16")), subset(t.approach, ids("q17")), subset(t.focus_areas, ids("q6")),
        subset(t.languages, ids("q5")), subset(t.formats, ["in_person", "video", "phone"]), subset(t.modalities, MODALITIES))
      .concat(CONTEXT_KEYS.filter((k) => ["strong", "some", "none"].indexOf(t.context[k]) === -1).map((k) => "context." + k))
      .concat(FF.GENDER_OPTIONS.some(([g]) => g === t.gender) ? [] : ["gender"])
      .concat([1, 2, 3].indexOf(t.fee_band) === -1 ? ["fee_band"] : [])
      .concat(["business", "weekends", "evenings_weekends"].indexOf(t.hours) === -1 ? ["hours"] : [])
      .concat(["near_campus", "cbd", "telehealth"].indexOf(t.location) === -1 ? ["location"] : []);
    check("Data", `${t.name}: all fields valid`, bad.length === 0, bad.length ? "Unknown: " + bad.join(", ") : "");
    check("Data", `${t.name}: up to 3 qualities`, t.qualities.length <= 3);
  });

  /* Robustness: no answers at all still gives a shortlist and doesn't throw. */
  try {
    const empty = FF.match({}, FF.THERAPISTS);
    check("Engine", "Empty answers return 3 therapists", empty.shortlist.length === 3 && empty.status === "full");
  } catch (e) {
    check("Engine", "Empty answers return 3 therapists", false, e.message);
  }

  /* Test patients */
  const details = [];
  FF.TEST_PATIENTS.forEach((p) => {
    const g = `Patient ${p.id}`;
    let r;
    try { r = FF.match(p.answers, FF.THERAPISTS); } catch (e) { check(g, "Runs", false, e.message); return; }
    const top = r.shortlist.map((x) => x.therapist.id);
    const shown = top.concat(r.closest.map((x) => x.therapist.id));
    const ex = p.expect;
    (ex.top3 || []).forEach((id) => check(g, `${id} in top 3`, top.indexOf(id) !== -1, "Top 3: " + top.join(", ")));
    if (ex.top3AnyOf) check(g, `one of ${ex.top3AnyOf.join(" / ")} in top 3`, ex.top3AnyOf.some((id) => top.indexOf(id) !== -1), "Top 3: " + top.join(", "));
    (ex.notShown || []).forEach((id) => check(g, `${id} not shown`, shown.indexOf(id) === -1, "Shown: " + shown.join(", ")));
    if (ex.status) check(g, `status is "${ex.status}"`, r.status === ex.status, `Got "${r.status}"`);
    check(g, "Shows 3 options in total", shown.length === 3, "Shown: " + shown.join(", "));
    check(g, "Closest fits say what they miss", r.closest.every((x) => x.misses.length > 0));
    // A therapist filtered out on format must not also be described as offering it.
    const formatClash = r.ranked.filter((x) => x.misses.some((m) => m.startsWith("Doesn't offer")) && x.reasons.some((q) => q.key === "format" && q.score === 1));
    check(g, "Session format line agrees with the filter", formatClash.length === 0, "Clash: " + formatClash.map((x) => x.therapist.id).join(", "));
    details.push({ p, r });
  });

  /* Render */
  const failed = results.filter((x) => !x.ok);
  const summary = document.getElementById("summary");
  summary.className = failed.length ? "fail" : "pass";
  summary.textContent = failed.length ? `${failed.length} of ${results.length} checks failed` : `All ${results.length} checks passed`;
  document.title = (failed.length ? "FAIL " : "PASS ") + (results.length - failed.length) + "/" + results.length;

  let html = "";
  const groups = [...new Set(results.map((x) => x.group))];
  groups.forEach((group) => {
    html += `<h2>${esc(group)}</h2><ul>`;
    results.filter((x) => x.group === group).forEach((x) => {
      html += `<li><span class="${x.ok ? "pass" : "fail"}">${x.ok ? "PASS" : "FAIL"}</span> ${esc(x.name)}${!x.ok && x.detail ? ` <span class="fail">(${esc(x.detail)})</span>` : ""}</li>`;
    });
    html += "</ul>";
    const d = details.find((x) => "Patient " + x.p.id === group);
    if (d) {
      html += `<p>${esc(d.p.label)}. Needs with sourced pairing: ${esc(d.r.needs.join(", ") || "none")}.</p><div class="wrap"><table><thead><tr><th>#</th><th>Therapist</th><th>Passed</th><th>Band</th><th>Score</th><th>Misses</th></tr></thead><tbody>`;
      d.r.ranked.forEach((x, i) => {
        html += `<tr><td>${i + 1}</td><td>${esc(x.therapist.name)}</td><td>${x.passed ? "yes" : "no"}</td><td>${x.band}</td><td>${x.score.toFixed(3)}</td><td>${esc(x.misses.join(" "))}</td></tr>`;
      });
      html += "</tbody></table></div>";
    }
  });
  out.innerHTML = html;
})();
</script>
</body>
</html>
