<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FIT-FIRST</title>
<!--
  FIT-FIRST MVP: matchmaking only, patient-focused. University design project; all therapist data is fictional.
  No build step: open this file by double-click (needs internet for the CDNs). Scripts are classic <script>s
  sharing a global `FF` namespace, because ES modules don't load from file://. Load order matters.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: 246 243 237;
    --surface: 255 255 255;
    --sunken: 239 235 227;
    --ink: 23 34 52;
    --muted: 80 91 108;
    --line: 223 217 206;
    --line-strong: 184 176 162;
    --accent: 28 86 96;
    --accent-ink: 255 255 255;
    --accent-soft: 225 236 235;
    --ochre: 128 88 24;
    --ochre-soft: 246 236 214;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: 16 21 28;
      --surface: 24 31 40;
      --sunken: 20 26 34;
      --ink: 236 232 224;
      --muted: 163 172 186;
      --line: 44 54 67;
      --line-strong: 82 94 110;
      --accent: 124 190 194;
      --accent-ink: 10 28 32;
      --accent-soft: 28 50 54;
      --ochre: 226 182 112;
      --ochre-soft: 50 41 26;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: 16 21 28;
    --surface: 24 31 40;
    --sunken: 20 26 34;
    --ink: 236 232 224;
    --muted: 163 172 186;
    --line: 44 54 67;
    --line-strong: 82 94 110;
    --accent: 124 190 194;
    --accent-ink: 10 28 32;
    --accent-soft: 28 50 54;
    --ochre: 226 182 112;
    --ochre-soft: 50 41 26;
    color-scheme: dark;
  }
  body {
    margin: 0;
    background: rgb(var(--paper));
    color: rgb(var(--ink));
    font-family: "Atkinson Hyperlegible", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2.5px solid rgb(var(--accent)); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
  #boot { display: grid; place-items: center; min-height: 60vh; color: rgb(var(--muted)); font-size: 15px; }
</style>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>
  const twVar = (name) => `rgb(var(--${name}) / <alpha-value>)`;
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          paper: twVar("paper"), surface: twVar("surface"), sunken: twVar("sunken"), ink: twVar("ink"), muted: twVar("muted"),
          line: twVar("line"), "line-strong": twVar("line-strong"),
          accent: twVar("accent"), "accent-ink": twVar("accent-ink"), "accent-soft": twVar("accent-soft"),
          ochre: twVar("ochre"), "ochre-soft": twVar("ochre-soft"),
        },
        fontFamily: {
          display: ['"Bricolage Grotesque"', "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "sans-serif"],
          sans: ['"Atkinson Hyperlegible"', "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "sans-serif"],
        },
      },
    },
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"><div id="boot">Loading FIT-FIRST…</div></div>
<script src="src/data/questions.js"></script>
<script src="src/data/therapists.js"></script>
<script src="src/data/test-patients.js"></script>
<script src="src/matching.js"></script>
<script src="src/ui.js"></script>
<script src="src/app.js"></script>
</body>
</html>
