<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thera-Fits explainer tests</title>
<style>
  :root { --paper: #f6f3ed; --ink: #172234; --muted: #505b6c; --line: #dfd9ce; --pass: #1c5660; --fail: #a12d2d; --open: #805818; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #10151c; --ink: #ece8e0; --muted: #a3acba; --line: #2c3643; --pass: #7cbec2; --fail: #f08a8a; --open: #e2b670; color-scheme: dark; }
  }
  body { margin: 0; padding: 24px 16px 48px; background: var(--paper); color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  main { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 32px 0 6px; }
  p { color: var(--muted); margin: 4px 0; }
  .pass { color: var(--pass); font-weight: 700; }
  .fail { color: var(--fail); font-weight: 700; }
  .open { color: var(--open); font-weight: 700; }
  ul { margin: 6px 0; padding-left: 20px; }
  table { border-collapse: collapse; width: 100%; margin-top: 8px; font-size: 14px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .wrap { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <h1>Explainer tests</h1>
  <p>Runs every ranking system in <code>matching/</code> against the data, the fictional test patients and the synthetic check-ins. It loads no website code: matching works on its own.
    OPEN marks an expectation the group hasn't settled; it doesn't count as a failure.</p>
  <p id="summary"></p>
  <div id="out"></div>
</main>
<script src="data/questions.js"></script>
<script src="data/therapists.js"></script>
<script src="data/test-patients.js"></script>
<script src="data/check-ins.js"></script>
<script src="matching/rankers.js"></script>
<script src="matching/criteria.js"></script>
<script src="matching/records.js"></script>
<script src="matching/research.js"></script>
<script src="matching/checklist.js"></script>
<script src="matching/access.js"></script>
<script src="matching/track-record.js"></script>
<script>
"use strict";
(function () {
  const out = document.getElementById("out");
  const results = [];
  const check = (group, name, ok, detail) => results.push({ group, name, state: ok ? "pass" : "fail", detail: detail || "" });
  const open = (group, name, ok, detail) => results.push({ group, name, state: ok ? "pass" : "open", detail: detail || "" });
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const T = FF.THERAPISTS;
  const R = FF.rankers;

  /* Data: every field uses ids the questions know, so scoring can't silently miss. */
  const ids = (qid) => FF.question(qid).options.map(([id]) => id);
  const MODALITIES = ["cbt", "act", "dbt", "ipt", "psychodynamic", "person_centred"];
  const outside = (arr, allowed) => arr.filter((x) => allowed.indexOf(x) === -1);
  check("Data", "8 therapists, unique ids", T.length === 8 && new Set(T.map((t) => t.id)).size === 8);
  T.forEach((t) => {
    const bad = []
      .concat(outside(t.qualities, ids("q16")), outside(t.approach, ids("q17")), outside(t.focus_areas, ids("q6")),
        outside(t.formats, ["in_person", "video", "phone"]), outside(t.modalities, MODALITIES))
      .concat(ids("q18").filter((k) => ["strong", "some", "none"].indexOf(t.context[k]) === -1).map((k) => "context." + k))
      .concat([1, 2, 3].indexOf(t.fee_band) === -1 ? ["fee_band"] : [])
      .concat(["business", "weekends", "evenings_weekends"].indexOf(t.hours) === -1 ? ["hours"] : [])
      .concat(typeof t.wait_days === "number" ? [] : ["wait_days"]);
    check("Data", `${t.name}: all fields valid`, bad.length === 0, bad.length ? "Unknown: " + bad.join(", ") : "");
  });
  FF.TEST_PATIENTS.forEach((p) => {
    const bad = [];
    Object.keys(p.answers).forEach((k) => {
      if (k === "must") return bad.push(...outside(Object.keys(p.answers.must), ids("q18")).map((x) => "must." + x));
      if (!FF.question(k)) return bad.push(k);
      bad.push(...outside([].concat(p.answers[k]), ids(k)).map((x) => `${k}.${x}`));
    });
    check("Data", `Patient ${p.id}: answers use known option ids`, bad.length === 0, bad.length ? "Unknown: " + bad.join(", ") : "");
  });

  /* Contract: every ranking system, on every patient plus edge cases, returns what the page relies on. */
  const everything = {};
  FF.QUESTIONS.forEach((q) => { everything[q.id] = q.type === "single" ? ids(q.id)[0] : ids(q.id).slice(0, q.max || 99); });
  everything.must = { cultural: true };
  const cases = FF.TEST_PATIENTS.map((p) => [`patient ${p.id}`, p.answers]).concat([["no answers", {}], ["every question answered", everything]]);
  check("Contract", "At least one ranking system, unique ids", R.list().length > 0 && new Set(R.list().map((r) => r.id)).size === R.list().length);
  const YEAR = { checkIns: FF.CHECK_INS };
  const contexts = [["", {}], [" with a year of check-ins", YEAR]];
  R.list().forEach((rk) => {
    const problems = [];
    contexts.forEach(([suffix, ctx]) => cases.forEach(([caseName, answers]) => {
      const name = caseName + suffix;
      try {
        R.check(rk, rk.rank(answers, T, ctx), T).forEach((x) => problems.push(`${name}: ${x}`));
        const tr = R.run(rk.id, answers, T, ctx);
        if (tr.results.map((r) => r.position).join() !== T.map((_, i) => i + 1).join()) problems.push(`${name}: positions aren't 1..${T.length}`);
        if (tr.shortlist.length > R.SHORTLIST_SIZE || tr.shortlist.some((r) => r.excluded.length)) problems.push(`${name}: bad shortlist`);
      } catch (e) { problems.push(`${name}: threw ${e.message}`); }
    }));
    check("Contract", `${rk.name}: valid on ${cases.length * contexts.length} cases`, problems.length === 0, problems.slice(0, 3).join(" · "));
  });

  /* The group's expectations, for the research-guided system (proposal section 5). */
  const details = [];
  FF.TEST_PATIENTS.forEach((p) => {
    const g = `Patient ${p.id}`;
    const tr = R.run("research", p.answers, T);
    const top = tr.shortlist.map((r) => r.id);
    const ex = p.expect;
    const shortTxt = "Shortlist: " + (top.join(", ") || "none");
    (ex.shortlist || []).forEach((id) => check(g, `${id} shortlisted`, top.indexOf(id) !== -1, shortTxt));
    if (ex.shortlistAnyOf) check(g, `one of ${ex.shortlistAnyOf.join(" / ")} shortlisted`, ex.shortlistAnyOf.some((id) => top.indexOf(id) !== -1), shortTxt);
    (ex.notShortlisted || []).forEach((id) => check(g, `${id} not shortlisted`, top.indexOf(id) === -1, shortTxt));
    if (ex.status) check(g, `status is "${ex.status}"`, tr.status === ex.status, `Got "${tr.status}"`);
    (p.open || []).forEach((o) => (o.notShortlisted || []).forEach((id) =>
      open(g, `${id} not shortlisted`, top.indexOf(id) === -1, `${shortTxt}. ${o.note}`)));
    details.push({ p, runs: R.list().map((rk) => R.run(rk.id, p.answers, T, YEAR)) });
  });

  /* Each system's description has to stay true, or the page would be explaining something false. */
  const find = (tr, id) => tr.results.find((r) => r.id === id);
  const areasFit = (rid, answers, tid) => (find(R.run(rid, answers, T), tid).parts.find((p) => p.kind === "areas") || {}).fit;
  const A = FF.TEST_PATIENTS.find((p) => p.id === "A").answers;
  const B = FF.TEST_PATIENTS.find((p) => p.id === "B").answers;
  const benAreas = { q6: ["study", "work", "anxiety"] };
  const rA = R.run("research", A, T);
  check("Research-guided", "Trained in the sourced pairing ranks first (patient A: Wei and Layla are 1 and 2)",
    rA.results.slice(0, 2).map((r) => r.id).sort().join() === "layla,wei", "Top 2: " + rA.results.slice(0, 2).map((r) => r.id).join(", "));
  check("Research-guided", "A long list of areas counts less (Ben lists 9: each match counts 3/9)",
    Math.abs(areasFit("research", benAreas, "ben") - 1 / 3) < 1e-9, "Fit: " + areasFit("research", benAreas, "ben"));
  check("Simple checklist", "A long list of areas counts in full (Ben's fit is 1)", areasFit("checklist", benAreas, "ben") === 1, "Fit: " + areasFit("checklist", benAreas, "ben"));
  check("Simple checklist", "No research group", R.run("checklist", A, T).results.every((r) => !r.group));
  check("Simple checklist", "Every weight is 1", R.run("checklist", A, T).results.every((r) => r.parts.every((p) => p.weight === 1)));
  const accB = find(R.run("access", B, T), "sam").parts.filter((p) => p.kind === "practical").length;
  check("Access first", "Fees, waiting time and hours count even when Q20 is blank (patient B)", accB === 3, `${accB} practical parts`);
  check("Access first", "Doesn't use the areas therapists list", R.run("access", A, T).results.every((r) => r.parts.every((p) => p.kind !== "areas")));
  check("Access first", "Patient A: Priya not shortlisted (the other answer to the open question)", !find(R.run("access", A, T), "priya").shortlisted);

  /* Profiles from check-ins: the rules in matching/records.js, on small hand-made cases. */
  const REC = FF.records;
  const { MIN_PEOPLE, HELPED, WORSE } = REC.RULES;
  // n people with one area, starting at 3 ("A lot"); deltas are each person's change (positive = better).
  const people = (deltas, area = "anxiety", tid = "maya") => deltas.map((d, i) => ({
    id: `h${i}`, therapist: tid, areas: [area], start: 0, finished: true,
    checkIns: [{ week: 0, session: 0, areas: { [area]: 3 }, overall: 2 }, { week: 4, session: 4, areas: { [area]: 3 - d }, overall: 2 }],
  }));
  const times = (n, d) => Array(n).fill(d);
  const labelOf = (courses, opts) => REC.build(courses, opts).record("maya", "anxiety").label;
  check("Profiles", `Fewer than ${MIN_PEOPLE} people: not enough evidence, however big the change`, labelOf(people(times(MIN_PEOPLE - 1, 3))) === "not_enough");
  check("Profiles", `${MIN_PEOPLE} people, average exactly ${HELPED} step better: helped`, labelOf(people(times(MIN_PEOPLE, HELPED))) === "helped");
  check("Profiles", "Average just under the helped line: no clear change", labelOf(people(times(MIN_PEOPLE - 1, 1).concat(0))) === "same");
  check("Profiles", `Average exactly ${WORSE} of a step worse: got worse`, labelOf(people(times(MIN_PEOPLE / 2, -1).concat(times(MIN_PEOPLE / 2, 0)))) === "worse");
  check("Profiles", "Average just above the worse line: no clear change", labelOf(people(times(MIN_PEOPLE / 2 - 1, -1).concat(times(MIN_PEOPLE / 2 + 1, 0)))) === "same");
  const early = REC.build(people(times(MIN_PEOPLE, 2)), { week: 3 }).record("maya", "anxiety");
  check("Profiles", "Before anyone's second check-in, nobody counts yet", early.people === 0 && early.waiting === MIN_PEOPLE && early.label === "not_enough", JSON.stringify(early));
  const zigzag = { id: "z", therapist: "maya", areas: ["anxiety"], start: 0, finished: false, checkIns: [
    { week: 0, session: 0, areas: { anxiety: 3 }, overall: 2 }, { week: 2, session: 2, areas: { anxiety: 1 }, overall: 1 },
    { week: 4, session: 4, areas: { anxiety: 2 }, overall: 2 }] };
  check("Profiles", "A person's change uses their latest check-in, not their best", REC.change(zigzag).areas.anxiety === 1, "Change: " + REC.change(zigzag).areas.anxiety);
  check("Profiles", "Someone who stopped early still counts, from their last check-in", REC.change(zigzag, 2).areas.anxiety === 2 && REC.change(zigzag, 2).measured);

  /* The synthetic year (data/check-ins.js): valid, and the profiles come out the way the recipe says. */
  const CI = FF.CHECK_INS;
  const RECIPE = FF.CHECK_IN_RECIPE;
  const tids = T.map((t) => t.id);
  const badCourses = CI.filter((c) => {
    const ws = c.checkIns.map((x) => x.week);
    const inScale = (v) => Number.isInteger(v) && v >= 0 && v <= 4;
    return tids.indexOf(c.therapist) === -1 || !c.areas.length || c.areas.length > 3 || new Set(c.areas).size !== c.areas.length
      || outside(c.areas, ids("q6")).length || c.checkIns[0].session !== 0 || c.checkIns[0].week !== c.start
      || ws.some((w, i) => i && w <= ws[i - 1]) || ws[ws.length - 1] > FF.CHECK_IN.YEAR_WEEKS
      || c.checkIns.some((x) => !inScale(x.overall) || Object.keys(x.areas).sort().join() !== c.areas.slice().sort().join() || c.areas.some((a) => !inScale(x.areas[a])));
  });
  check("Synthetic check-ins", `${CI.length} courses, unique ids`, CI.length > 0 && new Set(CI.map((c) => c.id)).size === CI.length);
  check("Synthetic check-ins", "Every course is valid: known therapist, 1 to 3 Q6 areas, answers 0 to 4 for exactly those areas, weeks in order within the year",
    badCourses.length === 0, badCourses.slice(0, 3).map((c) => c.id).join(", "));
  check("Synthetic check-ins", "Recipe covers exactly the 8 therapists", Object.keys(RECIPE).sort().join() === tids.slice().sort().join());
  const year = REC.build(CI);
  const mismatches = [];
  tids.forEach((tid) => REC.areaIds().forEach((a) => {
    const want = RECIPE[tid][a];
    const rec = year.record(tid, a);
    const wantLabel = !want || want[0] < MIN_PEOPLE ? "not_enough" : want[1];
    if (rec.label !== wantLabel || rec.people !== (want ? want[0] : 0)) mismatches.push(`${tid}/${a}: ${rec.label} from ${rec.people}, recipe ${want ? want.join(" ") : "none"}`);
  }));
  check("Synthetic check-ins", "At the end of the year, every therapist's profile matches the recipe", mismatches.length === 0, mismatches.slice(0, 3).join(" · "));
  const start = REC.build(CI, { week: 0 });
  check("Synthetic check-ins", "At the start of the year, nobody has a label yet", tids.every((tid) => REC.areaIds().every((a) => start.record(tid, a).label === "not_enough")));
  check("Synthetic check-ins", "Some people only ever checked in once, and don't count", year.waiting > 0, `${year.waiting} waiting`);
  const helpedCount = (tid) => REC.areaIds().filter((a) => year.record(tid, a).label === "helped").length;
  check("Synthetic check-ins", "Shaped like Kraus et al. (2011): every therapist helps with 2 or 3 areas, nobody with all of them",
    tids.every((tid) => helpedCount(tid) >= 2 && helpedCount(tid) <= 3), tids.map((tid) => `${tid} ${helpedCount(tid)}`).join(", "));
  const harmful = tids.filter((tid) => REC.areaIds().some((a) => year.record(tid, a).label === "worse"));
  check("Synthetic check-ins", "Two therapists have an area where patients got worse", harmful.length === 2, harmful.join(", "));
  const ben = T.find((t) => t.id === "ben");
  const sam = T.find((t) => t.id === "sam");
  check("Synthetic check-ins", "Ben lists anxiety and is trained in CBT, but patients with anxiety got worse",
    ben.focus_areas.indexOf("anxiety") !== -1 && ben.modalities.indexOf("cbt") !== -1 && year.record("ben", "anxiety").label === "worse");
  check("Synthetic check-ins", "Sam doesn't list anxiety, but patients with anxiety got better",
    sam.focus_areas.indexOf("anxiety") === -1 && year.record("sam", "anxiety").label === "helped");

  /* Track record: what its description promises. */
  const order = (tr) => tr.results.map((r) => r.id).join();
  const sameAsResearch = (ctx) => cases.filter(([, answers]) => order(R.run("track-record", answers, T, ctx)) !== order(R.run("research", answers, T))).map(([n]) => n);
  check("Track record", "No check-ins: ranks exactly like Research-guided, on every case", sameAsResearch({}).length === 0, sameAsResearch({}).join(", "));
  check("Track record", "Check-ins that don't count yet (week 0): still exactly like Research-guided", sameAsResearch({ checkIns: CI, week: 0 }).length === 0, sameAsResearch({ checkIns: CI, week: 0 }).join(", "));
  const yearProblems = [];
  cases.forEach(([name, answers]) => {
    const mine = [].concat(answers.q6 || []);
    R.run("track-record", answers, T, YEAR).results.forEach((r) => {
      const label = (a) => year.record(r.id, a).label;
      const worseMine = mine.some((a) => label(a) === "worse");
      const helpedMine = mine.some((a) => label(a) === "helped");
      const worseElse = REC.areaIds().some((a) => mine.indexOf(a) === -1 && label(a) === "worse");
      if (r.excluded.some((e) => e.question === "q6") !== worseMine) yearProblems.push(`${name}/${r.id}: filtered on Q6 only if patients with a picked area got worse`);
      if (r.group && r.group.order <= 1 && !helpedMine) yearProblems.push(`${name}/${r.id}: top groups need "helped" in a picked area`);
      if (r.group && helpedMine && r.group.order > 1) yearProblems.push(`${name}/${r.id}: "helped" in a picked area should rank first`);
      if (r.group && worseElse && r.group.order !== 1 && r.group.order !== 4) yearProblems.push(`${name}/${r.id}: worse elsewhere should rank lower`);
    });
  });
  check("Track record", "With a year of check-ins, every case follows the rules: worse filters, helped ranks first, worse elsewhere ranks lower", yearProblems.length === 0, yearProblems.slice(0, 3).join(" · "));
  const anxiety = { q6: ["anxiety"] };
  const trA = R.run("track-record", anxiety, T, YEAR);
  check("Track record", "Anxiety: Ben is filtered out, although Research-guided puts him in the research group",
    find(trA, "ben").excluded.length > 0 && find(R.run("research", anxiety, T), "ben").group.order === 0);
  check("Track record", "Anxiety: Sam ranks in the top group, ahead of the CBT-trained, though he doesn't list it",
    find(trA, "sam").group.order === 0 && find(trA, "sam").position < find(trA, "jordan").position);
  check("Track record", "Emotions: Riley is in the top groups but carries a caution (family)",
    find(R.run("track-record", { q6: ["emotions"] }, T, YEAR), "riley").group.order === 1);

  /* Render */
  const failed = results.filter((x) => x.state === "fail");
  const opened = results.filter((x) => x.state === "open");
  const counted = results.length - opened.length;
  const summary = document.getElementById("summary");
  summary.className = failed.length ? "fail" : "pass";
  summary.textContent = (failed.length ? `${failed.length} of ${counted} checks failed` : `All ${counted} checks passed`) + (opened.length ? `, ${opened.length} open` : "");
  document.title = (failed.length ? "FAIL " : "PASS ") + (counted - failed.length) + "/" + counted + (opened.length ? ` (${opened.length} open)` : "");

  let html = "";
  [...new Set(results.map((x) => x.group))].forEach((group) => {
    html += `<h2>${esc(group)}</h2><ul>`;
    results.filter((x) => x.group === group).forEach((x) => {
      const label = x.state.toUpperCase();
      html += `<li><span class="${x.state}">${label}</span> ${esc(x.name)}${x.state !== "pass" && x.detail ? ` <span class="${x.state}">(${esc(x.detail)})</span>` : ""}</li>`;
    });
    html += "</ul>";
    const d = details.find((x) => "Patient " + x.p.id === group);
    if (d) {
      html += `<p>${esc(d.p.label)}. Shortlist under each ranking system (Track record with the full synthetic year):</p><div class="wrap"><table><thead><tr><th>Ranking system</th><th>Status</th><th>Shortlist</th><th>Filtered out</th></tr></thead><tbody>`;
      d.runs.forEach((tr) => {
        const outIds = tr.results.filter((r) => r.excluded.length).map((r) => r.therapist.name);
        html += `<tr><td>${esc(tr.ranker.name)}</td><td>${tr.status}</td><td>${esc(tr.shortlist.map((r) => `${r.therapist.name} (${Math.round(r.score * 100) / 100}/${r.max})`).join(", ") || "none")}</td><td>${esc(outIds.join(", ") || "none")}</td></tr>`;
      });
      html += "</tbody></table></div>";
    }
  });
  out.innerHTML = html;
})();
</script>
</body>
</html>
