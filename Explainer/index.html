<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Thera-Fits matching details</title>
<link rel="icon" type="image/svg+xml" href="img/logo.svg" />
<!--
  Thera-Fits matching details: a behind-the-scenes view of how matching decides, for the project team.
  story.html tells the same story as an animated walkthrough, for anyone. Separate from App/ (the basic prototype).
  No build step: open this file by double-click (needs internet for the CDNs). Classic <script>s sharing a global
  `FF` namespace; load order matters.
  data/      questions, therapists, test patients, synthetic check-ins
  matching/  ranking systems. Knows nothing about this page (tests.html runs it without the page)
  site/      the pages (theme.css and theme.js are shared). Never score anything: they call FF.rankers.run() and
             FF.records.build() and draw the result
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="site/theme.css" />
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script src="site/theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"><div id="boot">Loading the matching explainer…</div></div>
<script src="data/questions.js"></script>
<script src="data/therapists.js"></script>
<script src="data/test-patients.js"></script>
<script src="data/check-ins.js"></script>
<!-- Ranking systems: rankers.js first (the contract), then criteria.js and records.js (shared measurements),
     then one file per system. The first one registered is the default. track-record.js builds on research.js. -->
<script src="matching/rankers.js"></script>
<script src="matching/criteria.js"></script>
<script src="matching/records.js"></script>
<script src="matching/research.js"></script>
<script src="matching/checklist.js"></script>
<script src="matching/access.js"></script>
<script src="matching/track-record.js"></script>
<script src="site/ui.js"></script>
<script src="site/profiles.js"></script>
<script src="site/app.js"></script>
</body>
</html>
